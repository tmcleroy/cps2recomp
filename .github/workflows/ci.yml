# Copyright (C) 2026 Tommy McLeroy. Part of cps2recomp.
# Every push and pull request, without any game: nothing from a game can be in the repository, so CI cannot
# build what a release holds (a game's program translated to C++ needs its ROM set). It audits the files
# (tools/audit.sh) and proves that everything compiles, packs and starts on each system: the collection as a
# release has it (tools/release/), with every game's program built with no translated code (NO_GAME_CODE=1:
# it runs a ROM set in the port's interpreters), and the toolkit's stand-in game (tools/ci_smoke.sh). The
# checks that need a ROM set (make GAME=<id> check, check-blocks, check-rewrites, check-release) and the
# release archives are made on a contributor's own machine. To be quick: SDL 3, librashader and the shaders are built
# once and kept (actions/cache, by the scripts that make them), the compiler's objects too (ccache); a pull request's
# Mac build is Apple silicon alone; a change of words only (the README, docs/) builds nothing; and a pull request's
# older run stops when a newer commit comes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# (a pull request's older run stops when a newer commit comes: the runners go to the one that counts)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NO_GAME_CODE: 1
  LINUX_PACKAGES: >-
    ninja-build zlib1g-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev
    libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev
    libpulse-dev libasound2-dev libudev-dev libdbus-1-dev libpipewire-0.3-dev

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tools/audit.sh
      - run: tools/sync-common.sh --check

  # Whether anything but words changed (the README, docs/, a changelog): the builds are skipped when not
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo code=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qvE '\.md$|^docs/|^LICENSE$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  macos:
    runs-on: macos-15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      # (a pull request: Apple silicon alone; main and a release: both halves)
      MAC_ARCHS: ${{ github.event_name == 'pull_request' && 'arm64' || 'arm64;x86_64' }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja ccache
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-macos-${{ env.MAC_ARCHS }}-${{ hashFiles('tools/release/lib.sh', 'tools/librashader.sh', 'tools/shaders.py') }}
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ env.MAC_ARCHS }}-${{ github.run_id }}
          restore-keys: ccache-macos-${{ env.MAC_ARCHS }}-
      - name: Build and pack
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: tools/release/macos.sh
      - name: Start the programs with no display
        run: |
          app="build/release/CPS-2 Recomp.app/Contents/MacOS"
          for game in $(cd games && ls); do
            "$app/$game" --list-features | grep -q free_play
            if [ "$MAC_ARCHS" != arm64 ]; then
              arch -x86_64 "$app/$game" --list-features | grep -q free_play
            fi
          done
          mkdir -p "$RUNNER_TEMP/home"
          SDL_VIDEO_DRIVER=dummy SDL_RENDER_DRIVER=software CPS2RECOMP_HOME="$RUNNER_TEMP/home" \
            "$app/cps2recomp-launcher" --screenshot "$RUNNER_TEMP/page"
          ls "$RUNNER_TEMP"/page*.png

  linux:
    strategy:
      matrix:
        include:
          - { system: linux-x86_64, runner: ubuntu-24.04 }
          - { system: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $LINUX_PACKAGES ccache
      # (SDL 3, librashader and the shaders, built once for their versions; and the compiler's objects)
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ matrix.system }}-${{ hashFiles('tools/release/lib.sh', 'tools/librashader.sh', 'tools/shaders.py') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.system }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.system }}-
      - name: Build and pack
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: tools/release/linux.sh
      - name: Start the programs with no display
        run: |
          tar -xzf build/release/CPS2Recomp-${{ matrix.system }}.tar.gz -C "$RUNNER_TEMP"
          for game in $(cd games && ls); do
            "$RUNNER_TEMP/CPS2Recomp/$game" --list-features | grep -q free_play
          done
          mkdir -p "$RUNNER_TEMP/home"
          SDL_VIDEO_DRIVER=dummy SDL_RENDER_DRIVER=software CPS2RECOMP_HOME="$RUNNER_TEMP/home" \
            "$RUNNER_TEMP/CPS2Recomp/cps2recomp-launcher" --screenshot "$RUNNER_TEMP/page"
          ls "$RUNNER_TEMP"/page*.png
      - name: The stand-in game (the toolkit with no game) built and started
        run: |
          export CMAKE_PREFIX_PATH="$PWD/build/deps/sdl-${{ matrix.system }}"
          make example
          tools/ci_smoke.sh

  # The Android app (tools/release/android.sh): built and packed; not started (no device here)
  android:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build ccache
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: The NDK the app is built with
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-34" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-android-${{ hashFiles('tools/release/lib.sh', 'tools/release/android.sh', 'tools/librashader.sh', 'tools/shaders.py') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.run_id }}
          restore-keys: ccache-android-
      - name: Build and pack
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: tools/release/android.sh
      - name: Every library in the app
        run: |
          libs=$(unzip -l build/release/CPS2Recomp-android.apk | awk '/lib\/arm64-v8a\//{print $4}')
          echo "$libs"
          for game in $(cd games && ls -d */ | tr -d /); do
            echo "$libs" | grep -q "lib$game.so" || { echo "error: no lib$game.so in the app" >&2; exit 1; }
          done

  windows-build:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build zip ccache
          g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 libz-mingw-w64-dev
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-windows-${{ hashFiles('tools/release/lib.sh', 'tools/release/windows.sh', 'tools/librashader.sh', 'tools/shaders.py') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-windows-${{ github.run_id }}
          restore-keys: ccache-windows-
      - name: Build and pack (cross-compiled)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: tools/release/windows.sh
      # (handed to the Windows machine below to be started; no translated code in it, and not a release)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-no-game-code
          path: build/release/CPS2Recomp-windows-x64.zip
          retention-days: 1

  windows-run:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-no-game-code
      - name: Start the programs on Windows with no display
        shell: bash
        run: |
          unzip -q CPS2Recomp-windows-x64.zip -d "$RUNNER_TEMP"
          for game in $(cd games && ls); do
            "$RUNNER_TEMP/CPS2Recomp/$game.exe" --list-features | grep -q free_play
          done
          mkdir -p "$RUNNER_TEMP/home"
          SDL_VIDEO_DRIVER=dummy SDL_RENDER_DRIVER=software CPS2RECOMP_HOME="$RUNNER_TEMP/home" \
            "$RUNNER_TEMP/CPS2Recomp/cps2recomp-launcher.exe" --screenshot "$RUNNER_TEMP/page"
          ls "$RUNNER_TEMP"/page*.png
