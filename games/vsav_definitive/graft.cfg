# Vampire Savior Definitive: the characters taken from Vampire Savior 2, and Vampire Savior's tables by character
# number that are to have entries for them (tools/graft.py makes from these and the two programs what
# src/graft.cpp patches in).
#
#   character <number> <name>
#   table <address> <stride> <entry bytes> <data|pc> <kind>
#
# A table is where Vampire Savior's code reads it (data: through an address register, from the program as data; pc:
# through the program counter, from the deciphered program), so many a character apart (stride), an entry's bytes
# from its start. Its entries for the characters are taken from Vampire Savior 2's same table (the place its code
# names where this game's names this one). Kinds:
#   value    numbers, as they are
#   code     a routine's address: theirs (at the base) or the one this game has (graft.py: place())
#   data     a table's address: Vampire Savior 2's, at the base
#   record   the whole stride, as it is
#   jump     word offsets from the table to code, jumped to (made by a hook: src/graft.cpp)
#   selfrel  word offsets from the table, added to its address (made by a hook)
#   entry    the entry's own place is what is used (made by a hook)
# other=<address>: Vampire Savior 2's table, where graft.py does not find it itself
#
#   extend <table> <stride> <data|pc> <entries here> <entries there> (read at <address>)
#
# A table of routines by a number that Vampire Savior 2 has more of: its routines for the numbers this game has not
# (made by a hook where the table is read).
# Found by following the character's number from where the code reads it (+382 and the copies of it) to where it
# indexes something; the ones in other characters' code are their answers to each opponent (throws and the like).

