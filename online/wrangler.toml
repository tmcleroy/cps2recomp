# The introduction service for online play (online/README.md): `wrangler deploy` from this folder
name = "cps2recomp-online"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "MATCHES"
class_name = "Match"

[[durable_objects.bindings]]
name = "LOBBIES"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Match"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Stats"]

# The relay's credentials (GET /v1/relay): at most 10 a minute from one IP. Its TURN key is two secrets, TURN_KEY_ID
# and TURN_KEY_API_TOKEN (online/README.md)
[[ratelimits]]
name = "RELAY_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
